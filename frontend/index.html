<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231b4332'><path d='M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z'/><path d='M6 6h10'/><path d='M6 10h10'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookNest — Library Management & Book Recommendations</title>
    <meta name="description" content="BookNest is a modern, full-stack library management system with personalized book recommendations, real-time catalogue tracking, and analytics." />
    <!-- Google Fonts: Lora for literary editorial headings, Inter for UI text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Avoid flash of unstyled theme
      (function() {
        try {
          var savedTheme = localStorage.getItem('booknest_theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = savedTheme || (systemDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
